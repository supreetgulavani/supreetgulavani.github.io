now:
  name: picl
  tagline: from chip datasheet to verified silicon tests
  paragraphs:
    - Writing the tests that access and check a chip's internal registers is slow, manual work
    - picl is a desktop tool that uses a local LLM to read a chip's documentation and generate IEEE&nbsp;1687 (IJTAG) tests, along with the hardware needed to run them
    - Each generated test is checked in simulation before it is marked as verified
  status: Currently in development.

