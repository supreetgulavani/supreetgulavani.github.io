title: Supreet Gulavani
email: sgsupreetgulavani@gmail.com
author: Supreet Gulavani
# Shown in search results and link previews for Home.
# Avoid "|" here: it is read as a Markdown table and the separators vanish.
description: "M.S. ECE (Computer Architecture), Portland State. Intel, NXP. Based in India, open to ASIC, RTL, DFT, design verification and post-silicon validation roles."
baseurl: ""
url: "https://supreetgulavani.github.io"

permalink: pretty

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-redirect-from
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM

social:
  name: Supreet Gulavani
  links:
    - https://github.com/supreetgulavani
    - https://linkedin.com/in/supreetgulavani

# Build settings
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle
  - AGENTS.md

defaults:
  # Fallback link-preview image for any page that doesn't set its own.
  - scope:
      path: ""
    values:
      image:
        path: /assets/images/share/home.png
        width: 1200
        height: 630
        alt: Supreet Gulavani
  # Keep these out of sitemap.xml: Google's verification file, and the résumé
  # PDF (it has a phone number; Work still links to it).
  - scope:
      path: googlec28e390ea7461b44.html
    values:
      sitemap: false
  - scope:
      path: assets/files
    values:
      sitemap: false
